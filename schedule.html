<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>毛毛排班月曆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #fff8f0;
            padding: 15px;
            min-height: 100vh;
        }
        /* 頂部同步狀態列 */
        .sync-status {
            max-width: 600px;
            margin: 0 auto 10px;
            padding: 6px 12px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sync-status.loading {
            background: #fff3e0;
            border-color: #ffe0b2;
            color: #ef6c00;
        }
        .btn-refresh {
            background: #ffb74d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        /* 頁面切換按鈕 */
        .page-tabs {
            max-width: 600px;
            margin: 0 auto 15px;
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            background: #ffb74d;
            color: white;
        }
        .tab-btn.active {
            background: #8c6d53;
            box-shadow: 0 2px 8px rgba(255,167,38,0.3);
        }
        .tab-btn:hover {
            background: #8c6d53;
        }
        /* 通用容器 */
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
            display: none;
        }
        .container.active {
            display: block;
        }
        /* 月曆頁面樣式 */
        .calendar-header {
            background-color: #ffb74d;
            color: white;
            padding: 18px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .month-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        .month-selector button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .month-selector button:hover {
            background: rgba(255,255,255,0.3);
        }
        .month-title {
            font-size: 19px;
            font-weight: bold;
            text-align: center;
            margin: 0 10px;
        }
        .year-select {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .year-select option {
            color: #333;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #fff3e0;
            border-bottom: 1px solid #ffe0b2;
        }
        .weekday {
            padding: 8px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #f57c00;
        }
        .weekday.sun {
            color: #e53935;
        }
        /* 日期容器 */
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            padding: 10px;
            grid-auto-rows: 95px;
        }
        .day {
            border-radius: 8px;
            padding: 4px 3px;
            border: 1px solid #ffe0b2;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 2px;
            background: #fff8f0;
            overflow: hidden;
        }
        /* 時段配色 */
        .day.bg-holiday { background: #f5e9d7; border-color: #e8d4b9; }
        .day.bg-morning { background: #fce4ec; border-color: #f8bbd0; }
        .day.bg-noon { background: #e8d9c8; border-color: #d2b48c; }
        .day.bg-night { background: #e3eaf5; border-color: #bdd0eb; }
        .day.bg-other { background: #e8f5e9; border-color: #c8e6c9; }
        .day:hover {
            border-color: #ffb74d;
            transform: translateY(-1px);
        }
        .day.empty {
            background: transparent;
            border: none;
        }
        .day.expired {
            background: #f5f5f5 !important;
            border-color: #e0e0e0 !important;
            opacity: 0.6;
            pointer-events: none;
            overflow: hidden;
        }
        .date {
            font-size: 13px;
            font-weight: bold;
            color: #f57c00;
            text-align: center;
            line-height: 1;
            flex-shrink: 0;
            height: 16px;
        }
        .shift-select {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 2px 1px;
            text-align: center;
            font-size: 11px;
            background: rgba(255,255,255,0.9);
            transition: all 0.2s;
            outline: none;
            color: #333;
            flex-shrink: 0;
            height: 20px;
        }
        .shift-select:focus {
            border-color: #ffb74d;
            background: #fff;
        }
        /* 班次信息 */
        .shift-info {
            font-size: 9px;
            color: #333;
            text-align: center;
            line-height: 1.2;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
            word-wrap: break-word;
            white-space: normal;
        }
        .s-code {
            font-weight: 700;
            font-size: 10px;
        }
        .s-code.blue {
            color: blue !important;
        }
        .s-time {
            font-weight: 400;
        }
        
        /* === 地點按鈕樣式（恢復最原始設定：白底、不粗體、原版框線） === */
        .loc-btn {
            width: 100%;
            padding: 1px 0;
            border: 1px solid #ddd; /* 最先那款的淡淡細灰線邊框 */
            border-radius: 3px;
            font-size: 9px;
            font-weight: normal; /* 拿掉粗體 */
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            height: 16px;
            background: #ffffff !important; /* 確保未選取時絕對是純白色背景 */
            color: #666;
        }
        /* 還原最先款點擊後的動態 Border 與文字配色（保持純白底，僅改變框線和文字） */
        .loc-btn.loc-orange { border-color: #ff9800 !important; color: #ff9800 !important; background: #ffffff !important; }
        .loc-btn.loc-blue   { border-color: #2196f3 !important; color: #2196f3 !important; background: #ffffff !important; }
        .loc-btn.loc-purple { border-color: #9c27b0 !important; color: #9c27b0 !important; background: #ffffff !important; }
        .loc-btn.loc-red    { border-color: #e53935 !important; color: #e53935 !important; background: #ffffff !important; }

        /* 地點清單小圓點標籤 */
        .loc-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        .bg-orange { background-color: #ff9800; }
        .bg-blue   { background-color: #2196f3; }
        .bg-purple { background-color: #9c27b0; }
        .bg-red    { background-color: #e53935; }

        /* 按鈕通用樣式 */
        .btn-save {
            display: block;
            width: 90%;
            margin: 15px auto 20px;
            padding: 12px;
            background: #ffb74d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-save:hover {
            background: #8c6d53;
        }
        /* 管理頁面通用樣式 */
        .manage-header {
            background-color: #ffb74d;
            color: white;
            padding: 20px 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .manage-form {
            padding: 20px 15px;
            border-bottom: 1px solid #ffe0b2;
            display: grid;
            gap: 15px;
            grid-template-columns: 1fr 1fr;
        }
        .manage-form .form-item {
            grid-column: span 2;
        }
        .form-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-item label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .form-input {
            padding: 10px;
            border: 1px solid #ffe0b2;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #333;
        }
        .form-input:focus {
            border-color: #ffb74d;
        }
        .btn-add {
            grid-column: span 2;
            padding: 12px;
            background: #ffb74d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-add:hover {
            background: #8c6d53;
        }
        .shift-list, .location-list {
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .shift-item, .location-item {
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            min-height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border: 1px solid #eee;
        }
        .shift-item.bg-holiday { background: #f5e9d7; border-color: #e8d4b9; }
        .shift-item.bg-morning { background: #fce4ec; border-color: #f8bbd0; }
        .shift-item.bg-noon { background: #e8d9c8; border-color: #d2b48c; }
        .shift-item.bg-night { background: #e3eaf5; border-color: #bdd0eb; }
        .shift-item.bg-other { background: #e8f5e9; border-color: #c8e6c9; }
        .shift-item-info, .location-item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-start;
            flex-grow: 1;
        }
        .shift-item-code, .location-item-code {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }
        .shift-item-time, .location-item-desc {
            font-size: 13px;
            color: #666;
        }
        .shift-item-color {
            font-size: 12px;
            color: #888;
        }
        .shift-actions, .location-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-edit, .btn-delete, .loc-btn-edit, .loc-btn-delete {
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit, .loc-btn-edit {
            background: #e3f2fd;
            color: #2196f3;
        }
        .btn-edit:hover, .loc-btn-edit:hover {
            background: #bbdefb;
        }
        .btn-delete, .loc-btn-delete {
            background: #ffebee;
            color: #e53935;
        }
        .btn-delete:hover, .loc-btn-delete:hover {
            background: #ffcdd2;
        }
        .btn-save-shifts, .btn-save-locations {
            margin: 15px;
        }
        .location-item.active-loc {
            border-left: 4px solid #ff9800;
            background: #fff8f0;
        }
        /* 手機小屏適配 */
        @media (max-width: 450px) {
            .days {
                gap: 4px;
                padding: 8px;
                grid-auto-rows: 90px;
            }
            .day {
                padding: 3px 2px;
                gap: 1px;
            }
            .date {
                font-size: 12px;
                height: 14px;
            }
            .shift-select {
                font-size: 10px;
                height: 18px;
            }
            .shift-info {
                font-size: 8.5px;
            }
            .s-code {
                font-size: 9px;
            }
            .loc-btn {
                font-size: 8.5px;
                height: 14px;
            }
            .tab-btn {
                font-size: 14px;
                padding: 8px;
            }
        }
        @media (max-width: 380px) {
            .days {
                grid-auto-rows: 85px;
            }
            .shift-info {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="sync-status loading" id="sync-bar">
        <span id="sync-text">🔄 正在連線雲端資料庫...</span>
        <button class="btn-refresh" id="btn-manual-refresh">手動同步</button>
    </div>

    <div class="page-tabs">
        <button class="tab-btn active" data-tab="calendar">排班月曆</button>
        <button class="tab-btn" data-tab="shift-manage">班次管理</button>
        <button class="tab-btn" data-tab="location-manage">地點管理</button>
    </div>

    <div class="container active" id="calendar">
        <div class="calendar-header">
            <div class="month-selector">
                <button id="prev-month">&lt;</button>
                <div class="month-title" id="month-title">2026年01月</div>
                <button id="next-month">&gt;</button>
            </div>
            <select id="year-select" class="year-select">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>
        </div>
        <div class="weekdays">
            <div class="weekday sun">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
        </div>
        <div class="days" id="days-container"></div>
        <button class="btn-save" id="save-calendar">儲存並同步本月排班</button>
    </div>

    <div class="container" id="shift-manage">
        <div class="manage-header">班次管理 | 新增/編輯/刪除</div>
        <form class="manage-form" id="shift-form">
            <div class="form-item">
                <label for="shift-code">班次程式（如D11H、L）</label>
                <input type="text" id="shift-code" class="form-input" placeholder="請輸入班次程式" required>
            </div>
            <div class="form-item">
                <label for="shift-time">上下班時間（如11:30 - 19:00、放假）</label>
                <input type="text" id="shift-time" class="form-input" placeholder="請輸入時間/備註" required>
            </div>
            <div class="form-item">
                <label for="shift-color">選擇班次配色</label>
                <select id="shift-color" class="form-input" required>
                    <option value="" selected disabled>請選擇配色</option>
                    <option value="holiday">放假 - 淺啡色</option>
                    <option value="morning">早更 - 粉紅色</option>
                    <option value="noon">午間 - 深啡色</option>
                    <option value="night">晚更 - 深藍色</option>
                    <option value="other">其他 - 淺綠色</option>
                </select>
            </div>
            <button type="submit" class="btn-add" id="btn-add-shift">新增班次</button>
        </form>
        <div class="shift-list" id="shift-list"></div>
        <button class="btn-save btn-save-shifts" id="save-shifts">儲存並同步所有班次</button>
    </div>

    <div class="container" id="location-manage">
        <div class="manage-header">地點管理 | 新增/編輯/刪除（默認LMC）</div>
        <form class="manage-form" id="location-form">
            <div class="form-item">
                <label for="location-code">地點簡寫（如LMC、TST）</label>
                <input type="text" id="location-code" class="form-input" placeholder="請輸入2-3個字簡寫" required>
            </div>
            <div class="form-item">
                <label for="location-desc">地點全名（如落馬洲、尖沙咀）</label>
                <input type="text" id="location-desc" class="form-input" placeholder="請輸入地點全名" required>
            </div>
            <div class="form-item">
                <label for="location-color">選擇顯示顏色</label>
                <select id="location-color" class="form-input" required>
                    <option value="orange" selected>橙色</option>
                    <option value="blue">藍色</option>
                    <option value="purple">紫色</option>
                    <option value="red">紅色</option>
                </select>
            </div>
            <div class="form-item">
                <label for="default-location">選擇預設地點</label>
                <select id="default-location" class="form-input" required>
                    <option value="KT">啟德</option>
                    <option value="SW">上環</option>
                    <option value="TST">尖沙咀</option>
                    <option value="高鐵">高鐵</option>
                    <option value="LMC">落馬洲</option>
                </select>
            </div>
            <button type="submit" class="btn-add" id="btn-add-location">新增地點</button>
        </form>
        <div class="location-list" id="location-list"></div>
        <button class="btn-save btn-save-locations" id="save-locations">儲存並同步所有地點</button>
    </div>

    <script>
        // === Supabase 設定 ===
        const SUPABASE_URL = "https://drfnyahztlchzcqfyaxj.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_rK1OQfY5mUXXI_oeHF3B0g_L0zC0oQL";

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); 
        const todayMonth = today.getMonth();
        const todayDate = today.getDate();
        let shiftTimes = {}; 
        let locations = {};  
        let editShiftCode = null; 
        let editLocCode = null;   
        let defaultLocation = 'KT'; // 預設地點

        const colorOrder = { 'holiday': 1, 'morning': 2, 'noon': 3, 'night': 4, 'other': 5 };

        const cloudDB = {
            async get(key, defaultValue) {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/momo_store?key=eq.${key}&select=value`, {
                        method: 'GET',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    const data = await res.json();
                    if (data && data.length > 0) return data[0].value;
                    return defaultValue;
                } catch (e) {
                    console.error("讀取雲端失敗:", e);
                    const local = localStorage.getItem(key);
                    return local ? JSON.parse(local) : defaultValue;
                }
            },
            async set(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/momo_store`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'resolution=merge-duplicates'
                        },
                        body: JSON.stringify({ key: key, value: value, updated_at: new Date() })
                    });
                    return true;
                } catch (e) {
                    console.error("雲端同步失敗:", e);
                    return false;
                }
            }
        };

        function updateSyncStatus(status, text) {
            const bar = document.getElementById('sync-bar');
            const txt = document.getElementById('sync-text');
            if (status === 'loading') {
                bar.className = 'sync-status loading';
                txt.textContent = `🔄 ${text}`;
            } else if (status === 'success') {
                bar.className = 'sync-status';
                txt.textContent = `✅ ${text}`;
            } else {
                bar.className = 'sync-status loading';
                txt.textContent = `⚠️ ${text}`;
            }
        }

        async function initApp() {
            updateSyncStatus('loading', '正在從雲端載入最新排班與設定...');
            
            const defaultShifts = {
                "B**": {time: "06:00 - 15:30", color: "morning"}, "B6": {time: "06:00 - 13:30", color: "morning"},
                "B": {time: "07:00 - 15:30", color: "morning"}, "B7": {time: "07:00 - 14:30", color: "morning"},
                "B8": {time: "08:00 - 15:30", color: "morning"}, "B8H": {time: "08:30 - 16:00", color: "morning"},
                "BB": {time: "06:00 - 15:30", color: "morning"}, "K/DD": {time: "08:45 - 17:33", color: "noon"},
                "D845": {time: "08:45 - 16:15", color: "noon"}, "D8H": {time: "08:30 - 16:00", color: "noon"},
                "D9": {time: "09:00 - 16:30", color: "noon"}, "D9H": {time: "09:30 - 17:00", color: "noon"},
                "D10": {time: "10:00 - 17:30", color: "noon"}, "D10H": {time: "10:30 - 18:00", color: "noon"},
                "D11": {time: "11:00 - 18:30", color: "noon"}, "D11H": {time: "11:30 - 19:00", color: "noon"},
                "D12": {time: "12:00 - 19:30", color: "noon"}, "D12H": {time: "12:30 - 20:00", color: "noon"},
                "E": {time: "14:30 - 23:00", color: "night"}, "E**": {time: "14:30 - 24:00", color: "night"},
                "E1": {time: "13:00 - 20:30", color: "night"}, "E1H": {time: "13:30 - 21:00", color: "night"},
                "E2": {time: "14:00 - 21:30", color: "night"}, "E2H": {time: "14:30 - 22:00", color: "night"},
                "E3": {time: "15:00 - 22:30", color: "night"}, "E3H": {time: "15:30 - 23:00", color: "night"},
                "E4": {time: "16:00 - 23:30", color: "night"}, "E4H": {time: "16:30 - 24:00", color: "night"},
                "EE": {time: "14:30 - 23:00", color: "night"}, "L": {time: "放假", color: "holiday"},
                "KCTA": {time: "23:00 - 07:30", color: "other"},
            };
            shiftTimes = await cloudDB.get('shiftTimes', defaultShifts);

            const defaultLocs = { "KT": { desc: "啟德", color: "orange" }, "TST": { desc: "尖沙咀", color: "orange" }, "LMC": { desc: "落馬洲", color: "orange" } };
            let rawLocs = await cloudDB.get('locations', defaultLocs);
            locations = {};
            Object.entries(rawLocs).forEach(([code, val]) => {
                if (typeof val === 'string') {
                    locations[code] = { desc: val, color: 'orange' };
                } else {
                    locations[code] = val;
                }
            });

            defaultLocation = await cloudDB.get('defaultLocation', 'KT'); // 獲取預設地點
            document.getElementById('default-location').value = defaultLocation; // 設置預設地點

            await refreshCalendarDisplay();
            renderShiftList();
            renderLocationList();
            updateSyncStatus('success', '已連線至雲端，資料為最新狀態');
        }

        document.getElementById('default-location').addEventListener('change', async (e) => {
            defaultLocation = e.target.value;
            await cloudDB.set('defaultLocation', defaultLocation); // 儲存新的預設地點
            renderLocationList(); // 重新渲染地點列表
        });

        async function refreshCalendarDisplay() {
            const storageKey = getStorageKey(currentYear, currentMonth);
            const calendarData = await cloudDB.get(storageKey, {});
            renderCalendar(currentYear, currentMonth, calendarData);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
                if (tab === 'calendar') {
                    updateSyncStatus('loading', '更新月曆排班中...');
                    await refreshCalendarDisplay();
                    updateSyncStatus('success', '月曆排班已是雲端最新狀態');
                }
            });
        });

        function getStorageKey(year, month) {
            return `shift_${year}-${(month + 1).toString().padStart(2, '0')}`;
        }

        function getSortedShiftCodes() {
            return Object.keys(shiftTimes).sort((a, b) => {
                const weightA = colorOrder[shiftTimes[a].color] || 99;
                const weightB = colorOrder[shiftTimes[b].color] || 99;
                if (weightA !== weightB) return weightA - weightB;
                return a.localeCompare(b, 'zh-CN', { numeric: true });
            });
        }

        function getSortedLocCodes() {
            return Object.keys(locations).sort((a, b) => {
                if (a === 'KT') return -1; if (b === 'KT') return 1;
                if (a === 'TST') return -1; if (b === 'TST') return 1;
                return a.localeCompare(b);
            });
        }

        // 月曆渲染
        function renderCalendar(year, month, calendarData) {
            const daysContainer = document.getElementById('days-container');
            daysContainer.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate(); 
            
            document.getElementById('month-title').textContent = `${year}年${(month + 1).toString().padStart(2, '0')}月`;
            document.getElementById('year-select').value = year;

            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.classList.add('day', 'empty');
                daysContainer.appendChild(emptyDay);
            }

            const sortedShiftCodes = getSortedShiftCodes();
            let shiftOptions = '<option value="" selected disabled></option>';
            sortedShiftCodes.forEach(shift => { shiftOptions += `<option value="${shift}">${shift}</option>`; });

            const availableLocs = getSortedLocCodes();

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                
                const isExpired = (year < currentYear) || 
                                  (year === currentYear && month < todayMonth) || 
                                  (year === currentYear && month === todayMonth && day < todayDate);
                if (isExpired) dayEl.classList.add('expired');

                const defaultLoc = availableLocs.includes(defaultLocation) ? defaultLocation : availableLocs[0] || 'KT';

                dayEl.innerHTML = `
                    <div class="date">${day}</div>
                    <select class="shift-select">${shiftOptions}</select>
                    <div class="shift-info"></div>
                    <button class="loc-btn" data-loc="${defaultLoc}">${defaultLoc}</button>
                `;
                daysContainer.appendChild(dayEl);

                if (calendarData[day]) {
                    const { shiftCode, locCode } = calendarData[day];
                    const select = dayEl.querySelector('.shift-select');
                    const infoEl = dayEl.querySelector('.shift-info');
                    const locBtn = dayEl.querySelector('.loc-btn');
                    
                    if (shiftCode && shiftTimes[shiftCode]) {
                        select.value = shiftCode;
                        dayEl.classList.add(`bg-${shiftTimes[shiftCode].color}`);
                        const codeClass = (shiftCode === 'BB' || shiftCode === 'EE') ? 's-code blue' : 's-code';
                        infoEl.innerHTML = `<span class="${codeClass}">${shiftCode}</span><span class="s-time">${shiftTimes[shiftCode].time}</span>`;
                    }

                    if (locCode) {
                        locBtn.textContent = locCode;
                        locBtn.setAttribute('data-loc', locCode);
                        locBtn.className = 'loc-btn'; 
                        
                        // 動態套用最原本經典的框線與顏色
                        const locObj = locations[locCode] || { color: 'orange' };
                        locBtn.classList.add(`loc-${locObj.color}`);
                    }
                }

                dayEl.querySelector('.shift-select').addEventListener('change', updateShiftInfo);
                
                dayEl.querySelector('.loc-btn').addEventListener('click', function() {
                    const currentLocs = getSortedLocCodes();
                    if (currentLocs.length === 0) return;

                    let currentLoc = this.getAttribute('data-loc') || 'KT';
                    let currentIndex = currentLocs.indexOf(currentLoc);
                    let nextLoc = currentLocs[(currentIndex + 1) % currentLocs.length];

                    this.textContent = nextLoc;
                    this.setAttribute('data-loc', nextLoc);

                    this.className = 'loc-btn';
                    const locObj = locations[nextLoc] || { color: 'orange' };
                    this.classList.add(`loc-${locObj.color}`);
                });
            }
        }

        function updateShiftInfo() {
            const code = this.value;
            const infoEl = this.nextElementSibling;
            const dayEl = this.parentElement;
            dayEl.classList.remove('bg-holiday', 'bg-morning', 'bg-noon', 'bg-night', 'bg-other');

            if (!code) { infoEl.innerHTML = ''; return; }
            dayEl.classList.add(`bg-${shiftTimes[code].color}`);
            const codeClass = (code === 'BB' || code === 'EE') ? 's-code blue' : 's-code';
            infoEl.innerHTML = `<span class="${codeClass}">${code}</span><span class="s-time">${shiftTimes[code].time}</span>`;
        }

        document.getElementById('prev-month').addEventListener('click', async () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            await refreshCalendarDisplay();
        });
        document.getElementById('next-month').addEventListener('click', async () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            await refreshCalendarDisplay();
        });
        document.getElementById('year-select').addEventListener('change', async (e) => {
            currentYear = parseInt(e.target.value);
            await refreshCalendarDisplay();
        });
        document.getElementById('btn-manual-refresh').addEventListener('click', async () => { await initApp(); });

        document.getElementById('save-calendar').addEventListener('click', async () => {
            updateSyncStatus('loading', '正在將排班上傳至雲端資料庫...');
            const storageKey = getStorageKey(currentYear, currentMonth);
            const saveData = {};
            let saveInfo = `✅ ${currentYear}年${currentMonth+1}月排班儲存成功！\n\n最新排班：\n`;
            let hasData = false;

            document.querySelectorAll('.day').forEach(dayEl => {
                const date = dayEl.querySelector('.date')?.textContent;
                if (!date) return; 
                const shiftCode = dayEl.querySelector('.shift-select')?.value;
                const locCode = dayEl.querySelector('.loc-btn').getAttribute('data-loc') || defaultLocation;
                
                saveData[date] = { shiftCode, locCode };
                if (shiftCode) {
                    hasData = true;
                    saveInfo += `📅 ${date}日 | 🕒 ${shiftCode}(${shiftTimes[shiftCode]?.time || ''}) | 📍 ${locCode}\n`;
                }
            });

            const success = await cloudDB.set(storageKey, saveData);
            if (success) {
                updateSyncStatus('success', '排班已同步至雲端！');
                alert(hasData ? saveInfo : `✅ ${currentYear}年${currentMonth+1}月排班已清空並同步！`);
            } else {
                alert('⚠️ 同步失敗，請檢查網路連線。');
            }
        });

        // ---------------------- 班次管理功能 ----------------------
        function renderShiftList() {
            const listContainer = document.getElementById('shift-list');
            listContainer.innerHTML = '';
            const sortedShiftCodes = getSortedShiftCodes();
            const colorName = { holiday: '放假-淺啡', morning: '早更-粉紅', noon: '午間-深啡', night: '晚更-深藍', other: '其他-淺綠' };
            
            sortedShiftCodes.forEach(code => {
                const {time, color} = shiftTimes[code];
                const item = document.createElement('div');
                item.className = `shift-item bg-${color}`;
                item.innerHTML = `
                    <div class="shift-item-info">
                        <span class="shift-item-code">${code}</span>
                        <span class="shift-item-time">${time}</span>
                        <span class="shift-item-color">配色：${colorName[color]}</span>
                    </div>
                    <div class="shift-actions">
                        <button class="btn-edit" data-code="${code}">編輯</button>
                        <button class="btn-delete" data-code="${code}">刪除</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
            bindShiftActions();
        }

        function bindShiftActions() {
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = e.target.dataset.code;
                    editShiftCode = code;
                    document.getElementById('shift-code').value = code;
                    document.getElementById('shift-time').value = shiftTimes[code].time;
                    document.getElementById('shift-color').value = shiftTimes[code].color;
                    document.getElementById('btn-add-shift').textContent = '保存編輯';
                });
            });
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = e.target.dataset.code;
                    if (confirm(`確定刪除班次【${code}】嗎？`)) { delete shiftTimes[code]; renderShiftList(); }
                });
            });
        }

        document.getElementById('shift-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('shift-code').value.trim();
            const time = document.getElementById('shift-time').value.trim();
            const color = document.getElementById('shift-color').value;

            if (editShiftCode) {
                delete shiftTimes[editShiftCode];
                shiftTimes[code] = {time, color};
                editShiftCode = null;
                document.getElementById('btn-add-shift').textContent = '新增班次';
            } else {
                if (shiftTimes[code]) { alert(`⚠️ 班次【${code}】已存在！`); return; }
                shiftTimes[code] = {time, color};
            }
            document.getElementById('shift-form').reset();
            renderShiftList();
        });

        document.getElementById('save-shifts').addEventListener('click', async () => {
            if (await cloudDB.set('shiftTimes', shiftTimes)) alert(`✅ 所有班次已同步至雲端！`);
        });

        // ---------------------- 地點管理功能 ----------------------
        function renderLocationList() {
            const listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';
            
            const sortedLocs = getSortedLocCodes();
            const colorNames = { orange: '橙色', blue: '藍色', purple: '紫色', red: '紅色' };

            sortedLocs.forEach(code => {
                const { desc, color } = locations[code];
                const item = document.createElement('div');
                item.className = `location-item ${code === defaultLocation ? 'active-loc' : ''}`; // 使當前預設地點高亮
                item.innerHTML = `
                    <div class="location-item-info">
                        <span class="location-item-code">${code}</span>
                        <span class="location-item-desc">${desc}</span>
                        <span class="loc-badge bg-${color}">標籤顏色：${colorNames[color] || '橙色'}</span>
                        ${code === defaultLocation ? '<br><span style="font-size:12px;color:#ff9800;">默認地點</span>' : ''}
                    </div>
                    <div class="location-actions">
                        <button class="loc-btn-edit" data-code="${code}">編輯</button>
                        <button class="loc-btn-delete" data-code="${code}">刪除</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
            bindLocationActions();
        }

        function bindLocationActions() {
            document.querySelectorAll('.loc-btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = e.target.dataset.code;
                    editLocCode = code; 
                    document.getElementById('location-code').value = code;
                    document.getElementById('location-desc').value = locations[code].desc;
                    document.getElementById('location-color').value = locations[code].color || 'orange';
                    document.getElementById('btn-add-location').textContent = '保存編輯';
                });
            });

            document.querySelectorAll('.loc-btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const code = e.target.dataset.code;
                    if (code === 'KT' || code === 'TST') {
                        alert('⚠️ 核心預設地點「KT」與「TST」不可刪除，但您可以使用【編輯】來修改它們！');
                        return;
                    }
                    if (confirm(`確定刪除地點【${code}】嗎？`)) {
                        delete locations[code];
                        renderLocationList();
                    }
                });
            });
        }

        document.getElementById('location-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('location-code').value.trim().toUpperCase();
            const desc = document.getElementById('location-desc').value.trim();
            const color = document.getElementById('location-color').value;
            if (!code || !desc) return;

            if (editLocCode) {
                if (editLocCode !== code && locations[code]) {
                    alert(`⚠️ 地點簡寫【${code}】已存在，請換一個簡寫！`);
                    return;
                }
                if ((editLocCode === 'KT' || editLocCode === 'TST') && editLocCode !== code) {
                    alert('⚠️ 核心預設地點的「簡寫碼(KT/TST)」不能更改，只能更改全名與顏色！');
                    return;
                }
                delete locations[editLocCode];
                locations[code] = { desc, color };
                editLocCode = null;
                document.getElementById('btn-add-location').textContent = '新增地點';
            } else {
                if (locations[code]) {
                    alert(`⚠️ 地點簡寫【${code}】已存在！`);
                    return;
                }
                locations[code] = { desc, color };
            }
            
            document.getElementById('location-form').reset();
            document.getElementById('location-color').value = 'orange';
            renderLocationList();
        });

        document.getElementById('save-locations').addEventListener('click', async () => {
            if (await cloudDB.set('locations', locations)) alert(`✅ 所有地點與顏色設定已同步至雲端！`);
        });

        window.onload = initApp;
    </script>
</body>
</html>
